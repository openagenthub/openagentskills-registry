# Sync Registry
#
# Runs after a push to main that changes skill.yaml files or categories.yaml.
# Validates changed skills via the Cloudflare Worker with persist=true (writes
# to KV), syncs categories, and rebuilds the manifest.
#
# Unlike the old build-index.yaml this workflow does NOT auto-commit anything
# back to the repo. All dynamic data lives in Cloudflare KV.

name: Sync Registry

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'openagentskills/**'
      - 'categories.yaml'

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed skill files
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            skills:
              - 'skills/**/skill.yaml'
            categories:
              - 'categories.yaml'

      - name: Sync changed skills to KV
        if: steps.changed.outputs.skills == 'true'
        env:
          WORKER_URL: ${{ secrets.VALIDATION_WORKER_URL }}
        run: |
          npm run sync-registry -- --changed-only '${{ steps.changed.outputs.skills_files }}'

      - name: Full sync (categories changed)
        if: steps.changed.outputs.categories == 'true' && steps.changed.outputs.skills != 'true'
        env:
          WORKER_URL: ${{ secrets.VALIDATION_WORKER_URL }}
        run: npm run sync-registry

      - name: Trigger web rebuild
        if: always()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: openagenthub/openagentskills-web
          event-type: registry-updated

  notify:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: echo "Registry sync failed -- add Discord/Slack notification here"
