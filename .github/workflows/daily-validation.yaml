# Daily Validation
#
# Runs at 6 AM UTC every day (and on manual dispatch). Validates ALL skills
# in the registry via the Cloudflare Worker, persists results to KV, and
# rebuilds the manifest.
#
# If any skills are broken (e.g. SKILL.md deleted from source repo), a
# GitHub issue is created so maintainers can follow up.
#
# No files are committed back to the repo -- all dynamic state lives in KV.

name: Daily Validation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-validation
  cancel-in-progress: true

jobs:
  validate-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all skills (persist to KV)
        id: validate
        env:
          WORKER_URL: ${{ secrets.VALIDATION_WORKER_URL }}
        run: |
          npm run sync-registry 2>&1 | tee validation.log
          BROKEN_COUNT=$(grep -c "FAIL:" validation.log || echo "0")
          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT

      - name: Create issue for broken skills
        if: steps.validate.outputs.broken_count != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Broken Skills Detected (${{ steps.validate.outputs.broken_count }})'
          content-filepath: validation.log
          labels: broken-link, maintenance

      - name: Trigger web rebuild
        if: always()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: openagenthub/openagentskills-web
          event-type: registry-updated
