# Validate PR
#
# Runs on every pull request that touches skill.yaml or SKILL.md files.
# Validates changed skills via the Cloudflare Worker (persist=false, so
# nothing is written to KV). Fails the check if any skill is invalid.

name: Validate PR

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'openagentskills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            skills:
              - 'skills/**/skill.yaml'
            content:
              - 'openagentskills/**/SKILL.md'

      - name: Validate changed skills
        if: steps.changed.outputs.skills == 'true'
        env:
          WORKER_URL: ${{ secrets.VALIDATION_WORKER_URL }}
          CHANGED_FILES: ${{ steps.changed.outputs.skills_files }}
        run: npm run validate:changed

      - name: Label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
