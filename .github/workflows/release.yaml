name: Release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to run Release Please against"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event.inputs.target_branch || 'main' }}
