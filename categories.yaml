# Category Definitions for Open Agent Skills Registry
# These categories help users discover skills by their primary use case

categories:
  - id: document-processing
    name: Document Processing
    description: Work with PDFs, Word docs, spreadsheets, and presentations
    icon: file-text

  - id: creative-design
    name: Creative & Design
    description: Generate images, SVGs, UI components, and visual content
    icon: palette

  - id: development-tools
    name: Development Tools
    description: Code generation, git workflows, testing, and deployment
    icon: code

  - id: data-analysis
    name: Data & Analysis
    description: Process data, analyze patterns, create visualizations
    icon: bar-chart

  - id: integrations
    name: Integrations
    description: MCP servers, API connectors, third-party services
    icon: plug

  - id: productivity
    name: Productivity
    description: Task management, automation, workflow optimization
    icon: zap

  - id: communication
    name: Communication
    description: Email drafting, documentation, technical writing
    icon: message-square

  - id: database
    name: Database
    description: SQL, NoSQL, query optimization, schema design
    icon: database

  - id: deployment
    name: Deployment
    description: CI/CD, cloud platforms, infrastructure as code
    icon: cloud

  - id: testing
    name: Testing
    description: Unit tests, integration tests, test automation
    icon: check-circle
